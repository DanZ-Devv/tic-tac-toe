<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <form>
            <div class="players">
                <input id="player1" name="player1" placeholder="Player X" required>
                <input id="player2" name="player2" placeholder="Player O" required>
            </div>
            <button type="submit" class="start">Start</button>
        </form>
        <div class="game-board">
        </div>
        <dialog class="result">
        </dialog>
        <button class="reset">Reset</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
